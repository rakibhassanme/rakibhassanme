<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
    <defs>
        <!-- Indigo Radial Ambient Glow -->
        <radialGradient id="indigoGlow" cx="50%" cy="45%" r="65%">
            <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.32" />
            <stop offset="60%" stop-color="#3730a3" stop-opacity="0.10" />
            <stop offset="100%" stop-color="#05070d" stop-opacity="0" />
        </radialGradient>

        <!-- Indigo Border Gradient -->
        <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
            <stop offset="50%" stop-color="#4338ca" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4" />
        </linearGradient>

        <!-- Indigo Accent Gradient -->
        <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#4f46e5" />
        </linearGradient>

        <style>
            .name {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                font-size: 72px;
                font-weight: 800;
                fill: #ffffff;
                text-anchor: middle;
                dominant-baseline: middle;
                letter-spacing: -2px;
            }

            .dot {
                fill: url(#indigoGrad);
            }

            .title {
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                font-size: 20px;
                font-weight: 500;
                fill: #c7d2fe;
                text-anchor: middle;
                dominant-baseline: middle;
                letter-spacing: 2px;
            }

            .accent {
                fill: #6366f1;
            }
        </style>
    </defs>

    <!-- Dark Base Background -->
    <rect width="100%" height="100%" fill="#07090e" rx="14" />

    <!-- Ambient Indigo Glow -->
    <rect width="100%" height="100%" fill="url(#indigoGlow)" rx="14" />

    <!-- Subtle Indigo Border -->
    <rect x="1" y="1" width="798" height="248" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" rx="13" />

    <!-- Main Content -->
    <g transform="translate(0, 0)">
        <!-- Name -->
        <text x="400" y="110" class="name">
            Rakib Hassan<tspan class="dot">.</tspan>
        </text>
        
        <!-- Title -->
        <text x="400" y="170" class="title">
            Full-Stack Developer
        </text>
    </g>
</svg>
